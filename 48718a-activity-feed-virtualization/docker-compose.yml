# Main docker-compose for running tests and evaluation
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: activity-feed-evaluation
    volumes:
      - .:/app
      - /app/node_modules
      - /app/repository_before/activity-feed-virtualization/node_modules
      - /app/repository_after/node_modules
    environment:
      - PYTHONPATH=/app
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true